openapi: 3.0.3
info:
  title: Org Admin (Organization & Members)
  version: 0.1.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Orgs
  - name: Departments
  - name: Members
  - name: Invitations
  - name: ImportExport
  - name: AuditLogs
  - name: Meta
  - name: Files

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string }
    DeptIdQuery:
      name: deptId
      in: query
      required: false
      schema: { type: string, nullable: true }
    KeywordQuery:
      name: keyword
      in: query
      required: false
      schema: { type: string, nullable: true }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  schemas:
    ApiResponse:
      type: object
      properties:
        requestId: { type: string }
        data: {}
        error:
          $ref: "#/components/schemas/ApiError"
      required: [requestId]

    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
      required: [code, message]

    PagedResult:
      type: object
      properties:
        items:
          type: array
          items: {}
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [items, total, page, pageSize]

    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, LEFT]

    Org:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        memberCount: { type: integer }
        activeMemberCount: { type: integer }
        leftMemberCount: { type: integer }
      required: [id, name, memberCount]

    Department:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        order: { type: integer }
        disabled: { type: boolean }
        memberCount: { type: integer }
        path:
          type: array
          items: { type: string }
          description: "From root to self, e.g. ['Company','研发部','test']"
      required: [id, orgId, name]

    DepartmentNode:
      allOf:
        - $ref: "#/components/schemas/Department"
        - type: object
          properties:
            children:
              type: array
              items: { $ref: "#/components/schemas/DepartmentNode" }

    MemberListItem:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        alias: { type: string, nullable: true }

        accountStatus: { $ref: "#/components/schemas/AccountStatus" }

        mobile: { type: string, nullable: true, description: "contact mobile, E.164, e.g. +8613800000000" }
        loginMobile: { type: string, nullable: true, description: "login mobile, E.164" }
        loginEmail: { type: string, nullable: true, format: email }

        maskedMobile: { type: string, nullable: true }
        maskedLoginMobile: { type: string, nullable: true }
        maskedLoginEmail: { type: string, nullable: true }

        departmentId: { type: string, nullable: true }
        departmentName: { type: string, nullable: true }
        departmentPath: { type: string, nullable: true, description: "e.g. 公司/实验室产品&技术部/test" }

        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, orgId, name, accountStatus]

    MemberDetail:
      allOf:
        - $ref: "#/components/schemas/MemberListItem"
        - type: object
          properties:
            lastLoginAt: { type: string, format: date-time, nullable: true }
            leftAt: { type: string, format: date-time, nullable: true }
            note: { type: string, nullable: true }

    CurrentUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        alias: { type: string, nullable: true }
        accountStatus: { $ref: "#/components/schemas/AccountStatus" }
        mobile: { type: string, nullable: true, description: "contact mobile, E.164" }
        loginMobile: { type: string, nullable: true, description: "login mobile, E.164" }
        loginEmail: { type: string, nullable: true, format: email }
        orgId: { type: string }
        orgName: { type: string }
        departmentId: { type: string, nullable: true }
        departmentName: { type: string, nullable: true }
        departmentPath: { type: string, nullable: true, description: "e.g. 公司/实验室产品&技术部/test" }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, accountStatus, orgId, orgName, createdAt, updatedAt]

    Invitation:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        channel: { type: string, enum: [EMAIL, SMS, LINK] }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        targets:
          type: array
          items:
            type: object
            properties:
              name: { type: string, nullable: true }
              email: { type: string, format: email, nullable: true }
              mobile: { type: string, nullable: true }
              departmentId: { type: string, nullable: true }
            additionalProperties: false
        expireAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, orgId, channel, status, createdAt]

    TaskStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCESS, FAILED]

    ImportTask:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        successCount: { type: integer }
        failCount: { type: integer }
        errorReportFileId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, orgId, status, progress, createdAt]

    ExportTask:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        fileId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, orgId, status, progress, createdAt]

    AuditLog:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        actionType: { type: string }
        operatorId: { type: string }
        operatorName: { type: string }
        targetId: { type: string, nullable: true }
        targetType: { type: string, nullable: true }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
      required: [id, orgId, actionType, operatorId, createdAt]

paths:
  /api/meta/enums:
    get:
      tags: [Meta]
      summary: Get enums / dictionaries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accountStatus:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { $ref: "#/components/schemas/AccountStatus" }
                                label: { type: string }
                          invitationChannel:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { type: string }
                                label: { type: string }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf: [$ref: "#/components/schemas/ApiResponse"]
        "401":
          description: Unauthorized

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          description: Unauthorized

  /api/orgs/{orgId}:
    get:
      tags: [Orgs]
      summary: Get org basic info (top title + counts)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Org" }

  /api/orgs/{orgId}/departments/tree:
    get:
      tags: [Departments]
      summary: Get department tree (left sidebar)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DepartmentNode" }

  /api/orgs/{orgId}/departments:
    post:
      tags: [Departments]
      summary: Create department
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                order: { type: integer, nullable: true }
              required: [name]
      responses:
        "200":
          description: OK

  /api/departments/{deptId}:
    patch:
      tags: [Departments]
      summary: Update department (rename/move/disable)
      parameters:
        - name: deptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true }
                parentId: { type: string, nullable: true }
                order: { type: integer, nullable: true }
                disabled: { type: boolean, nullable: true }
      responses:
        "200":
          description: OK
    delete:
      tags: [Departments]
      summary: Delete department
      parameters:
        - name: deptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /api/orgs/{orgId}/members:
    get:
      tags: [Members]
      summary: List members (table)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/DeptIdQuery"
        - name: includeSubDepartments
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: accountStatus
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AccountStatus" }
        - $ref: "#/components/parameters/KeywordQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PagedResult"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/MemberListItem" }

    post:
      tags: [Members]
      summary: Add member (admin creates)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                alias: { type: string, nullable: true }
                departmentId: { type: string, nullable: true }
                mobile: { type: string, nullable: true }
                loginMobile: { type: string, nullable: true }
                loginEmail: { type: string, format: email, nullable: true }
                initPassword: { type: string, nullable: true }
              required: [name]
      responses:
        "200":
          description: OK

  /api/orgs/{orgId}/members/left:
    get:
      tags: [Members]
      summary: List left members (已离职成员 tab)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/KeywordQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK

  /api/members/{memberId}:
    get:
      tags: [Members]
      summary: Get member detail (详情)
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MemberDetail" }

    patch:
      tags: [Members]
      summary: Update member basic info
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true }
                alias: { type: string, nullable: true }
                mobile: { type: string, nullable: true }
                loginMobile: { type: string, nullable: true }
                loginEmail: { type: string, format: email, nullable: true }
                avatarUrl: { type: string, nullable: true }
      responses:
        "200":
          description: OK

  /api/members/{memberId}/status:
    post:
      tags: [Members]
      summary: Change account status (active/disabled)
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountStatus: { $ref: "#/components/schemas/AccountStatus" }
                reason: { type: string, nullable: true }
              required: [accountStatus]
      responses:
        "200":
          description: OK

  /api/members/batch/status:
    post:
      tags: [Members]
      summary: Batch change account status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberIds:
                  type: array
                  items: { type: string }
                accountStatus: { $ref: "#/components/schemas/AccountStatus" }
                reason: { type: string, nullable: true }
              required: [memberIds, accountStatus]
      responses:
        "200":
          description: OK

  /api/members/{memberId}/leave:
    post:
      tags: [Members]
      summary: Leave member (操作离职)
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leaveAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200":
          description: OK

  /api/members/batch/leave:
    post:
      tags: [Members]
      summary: Batch leave members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberIds:
                  type: array
                  items: { type: string }
                leaveAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
              required: [memberIds]
      responses:
        "200":
          description: OK

  /api/members/{memberId}/change-department:
    post:
      tags: [Members]
      summary: Change member department (变更部门)
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toDepartmentId: { type: string }
                effectiveAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
              required: [toDepartmentId]
      responses:
        "200":
          description: OK

  /api/members/batch/change-department:
    post:
      tags: [Members]
      summary: Batch change department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberIds:
                  type: array
                  items: { type: string }
                toDepartmentId: { type: string }
                effectiveAt: { type: string, format: date-time, nullable: true }
                note: { type: string, nullable: true }
              required: [memberIds, toDepartmentId]
      responses:
        "200":
          description: OK

  /api/orgs/{orgId}/invitations:
    post:
      tags: [Invitations]
      summary: Invite members (邀请成员)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, enum: [EMAIL, SMS, LINK] }
                expireInHours: { type: integer, nullable: true, default: 168 }
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string, nullable: true }
                      email: { type: string, format: email, nullable: true }
                      mobile: { type: string, nullable: true }
                      departmentId: { type: string, nullable: true }
                    additionalProperties: false
              required: [channel, targets]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Invitation" }

    get:
      tags: [Invitations]
      summary: List invitations
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK

  /api/invitations/{inviteId}/revoke:
    post:
      tags: [Invitations]
      summary: Revoke invitation
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /api/orgs/{orgId}/members/import-template:
    get:
      tags: [ImportExport]
      summary: Download import template
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Excel file
          content:
            application/octet-stream: {}

  /api/orgs/{orgId}/members/import:
    post:
      tags: [ImportExport]
      summary: Import members (async)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileId: { type: string }
                mode: { type: string, enum: [CREATE, UPSERT], default: CREATE }
                defaultDepartmentId: { type: string, nullable: true }
                sendInvite: { type: boolean, default: false }
              required: [fileId]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ImportTask" }

  /api/import-tasks/{taskId}:
    get:
      tags: [ImportExport]
      summary: Get import task status
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /api/orgs/{orgId}/members/export:
    post:
      tags: [ImportExport]
      summary: Export members (async)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId: { type: string, nullable: true }
                includeSubDepartments: { type: boolean, default: true }
                accountStatus: { $ref: "#/components/schemas/AccountStatus" }
                keyword: { type: string, nullable: true }
                fields:
                  type: array
                  items: { type: string }
                  nullable: true
      responses:
        "200":
          description: OK

  /api/export-tasks/{taskId}:
    get:
      tags: [ImportExport]
      summary: Get export task status
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /api/export-tasks/{taskId}/file:
    get:
      tags: [ImportExport]
      summary: Download exported file
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: file
          content:
            application/octet-stream: {}

  /api/orgs/{orgId}/audit-logs:
    get:
      tags: [AuditLogs]
      summary: List audit logs
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: actionType
          in: query
          required: false
          schema: { type: string, nullable: true }
        - name: operatorId
          in: query
          required: false
          schema: { type: string, nullable: true }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time, nullable: true }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time, nullable: true }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK